<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: "FluenteMente" }}</title>
  
  <!-- Qui colleghi il tuo file CSS principale -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body class="site-body">

  <!-- Richiama l'header creato in _includes/header.html -->
  {% include header.html %}

  <!-- Contenitore principale dove verranno caricati i contenuti o le visual cards -->
  <main class="site-main">
    {{ content }}
  </main>

  <!-- Richiama il footer creato in _includes/footer.html -->
  {% include footer.html %}

</body>
</html>
