---
layout: default
---

<article class="grammar-container">
  <a href="javascript:history.back()" class="back-link">← Torna indietro</a>

  <header class="grammar-header">
    <span class="badge" style="margin-bottom: 15px; display: inline-block;">{{ page.cluster }}</span>
    <h1 class="grammar-title">{{ page.title }}</h1>
    
    {% if page.description %}
    <div class="in-breve-box">
      <strong>⚙️ Come funziona:</strong> {{ page.description }}
    </div>
    {% endif %}
  </header>

  <div class="grammar-content">
    {{ content }}
  </div>
</article>
