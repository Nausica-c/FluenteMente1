---
layout: default
---

<article class="article-container">
  <a href="javascript:history.back()" class="back-link">← Torna indietro</a>

  <header class="article-header">
    <span class="badge" style="margin-bottom: 15px; display: inline-block;">{{ page.cluster }}</span>
    <h1 class="article-title">{{ page.title }}</h1>
    
    {% if page.description %}
    <div class="in-breve-box">
      <strong>🎯 In breve:</strong> {{ page.description }}
    </div>
    {% endif %}
  </header>

  <div class="article-content">
    {{ content }}
  </div>
</article>
